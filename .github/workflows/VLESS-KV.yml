name: VLESS-KV

on:
  workflow_dispatch:
  schedule:
    #- cron: '40 22 * * *'     # 每天 22:40 UTC（北京时间 6:40）
    - cron: '0 8 * * *'     # 每天 08:00 UTC（北京时间 16:00）

jobs:
  upload-to-r2:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: 安装依赖包（完全兼容版本）
        run: |
          echo "🔧 开始安装依赖..."
          
          # 1. 先升级 pip 确保最新
          python -m pip install --upgrade pip
          
          # 2. 创建虚拟环境避免系统级别冲突
          python -m venv venv || true
          source venv/bin/activate
          python -m pip install --upgrade pip
          
          # 3. 强制安装特定版本的 requests 及其依赖链
          echo "安装兼容版本依赖链..."
          python -m pip install \
            "urllib3==2.2.0" \
            "charset-normalizer==3.3.2" \
            "certifi==2024.7.4" \
            "idna==3.7" \
            --force-reinstall --no-deps
          
          # 4. 关键步骤：安装兼容的 requests
          # 先卸载所有可能冲突的包
          python -m pip uninstall -y requests urllib3 charset-normalizer chardet || true
          
          # 重新从 requirements.txt 文件安装，避免自动升级
          cat > requirements-fixed.txt << 'EOF'
          urllib3==2.2.0
          charset-normalizer==3.3.2
          certifi==2024.7.4
          idna==3.7
          requests==2.32.3
          EOF
          
          python -m pip install -r requirements-fixed.txt --force-reinstall
          
          # 5. 验证安装版本
          echo "验证安装版本："
          python -c "
          import warnings
          import subprocess
          import sys
          # 抑制警告
          warnings.filterwarnings('ignore')
          # 检查实际安装的包版本
          result = subprocess.run([sys.executable, '-m', 'pip', 'show', 'urllib3'], capture_output=True, text=True)
          for line in result.stdout.split('\n'):
              if 'Version:' in line:
                  print('✓ 实际安装的 urllib3 版本:', line.split(': ')[1])
          "
          python -c "
          import requests
          import urllib3
          import charset_normalizer as cs
          print('✓ requests 版本:', requests.__version__)
          print('✓ urllib3 版本:', urllib3.__version__)
          print('✓ charset-normalizer 版本:', cs.__version__)
          "
          
          # 6. 安装其他包 - 使用 --no-deps 并手动安装依赖
          echo "安装其他包..."
          
          # 6.1 先安装 telethon 的依赖
          python -m pip install "pyasn1==0.6.1" "rsa==4.9"
          
          # 6.2 安装 telethon（跳过依赖检查）
          echo "安装 telethon..."
          python -m pip install "telethon==1.35.9" --no-deps
          
          # 6.3 重新安装 requests（确保版本正确）
          python -m pip install "requests==2.32.3" --force-reinstall
          
          # 6.4 安装 selenium 及其依赖
          python -m pip install "selenium==4.22.0" "undetected-chromedriver==3.5.7" "chromedriver-autoinstaller==0.6.2" "beautifulsoup4==4.12.0"
          
          # 6.5 安装 crawl4ai（跳过依赖）
          python -m pip install "crawl4ai==0.1.5" --no-deps
          
          # 6.6 最后安装 awscli（这通常会升级 urllib3，所以要最后安装）
          echo "安装 awscli（最后安装）..."
          python -m pip install \
            "botocore==1.34.76" \
            "boto3==1.34.76" \
            "s3transfer==0.10.3" \
            "jmespath==1.0.1" \
            --no-deps
          python -m pip install "awscli==1.32.76" --no-deps
          
          # 6.7 安装 playwright
          export PYTHONPATH=$PYTHONPATH:$(pwd)/venv/lib/python3.13/site-packages
          python -m pip install playwright
          playwright install chromium
          
          echo "✅ 依赖安装完成"
          
          # 7. 最终验证
          python -c "
          import warnings
          warnings.filterwarnings('ignore')
          import requests
          import sys
          # 添加路径确保使用当前安装的包
          sys.path.insert(0, 'venv/lib/python3.13/site-packages')
          try:
              # 导入可能会触发警告
              import urllib3
              import charset_normalizer
              print('最终验证：')
              print('✓ requests:', requests.__version__)
              print('✓ urllib3:', urllib3.__version__)
              print('✓ charset-normalizer:', charset_normalizer.__version__)
              if requests.__version__ == '2.32.3' and urllib3.__version__ == '2.2.0':
                  print('✅ 所有版本都正确！')
              else:
                  print('⚠️  版本不匹配，但已抑制警告')
          except Exception as e:
              print(f'导入错误: {e}')
          "

      - name: 抑制 warnings 环境变量
        run: |
          # 设置环境变量抑制所有 Python 警告
          echo "PYTHONWARNINGS=ignore" >> $GITHUB_ENV
          echo "REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt" >> $GITHUB_ENV

      - name: 清空旧连接文件
        run: |
          echo -n "" > links.txt
          echo -n "" > usb.txt

      - name: 执行 Python 脚本
        env:
          PYTHONWARNINGS: "ignore::DeprecationWarning,ignore::UserWarning"
        run: |
          echo "🔨 开始执行脚本..."
          # 确保使用虚拟环境
          source venv/bin/activate || true
          # 设置Python路径
          export PYTHONPATH=$(pwd)/venv/lib/python3.13/site-packages:$PYTHONPATH
          
          # 创建 wrapper 脚本抑制警告
          cat > run_without_warnings.py << 'EOF'
          import warnings
          import sys
          import os
          
          # 完全抑制所有 warnings
          warnings.filterwarnings('ignore')
          # 专门抑制 urllib3 警告
          warnings.filterwarnings('ignore', category=UserWarning, module='requests')
          
          # 执行脚本
          script_name = sys.argv[1]
          with open(script_name, 'r', encoding='utf-8') as f:
              exec(f.read())
          EOF
          
          # 执行脚本
          python run_without_warnings.py get_token.py
          python run_without_warnings.py MB.py
          python run_without_warnings.py 58LA.py
          python run_without_warnings.py sub.py
          python run_without_warnings.py yz.py
          
          echo "✅ 脚本执行完成"

      - name: 同步到 Cloudflare KV
        env:
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_KV_KEY: "LINK.txt"
          PYTHONWARNINGS: "ignore"
        run: |
          echo "☁️ 同步数据到 Cloudflare KV..."
          source venv/bin/activate || true
          export PYTHONPATH=$(pwd)/venv/lib/python3.13/site-packages:$PYTHONPATH
          # 使用虚拟环境中的 Python
          $(pwd)/venv/bin/python kv.py
          echo "✅ KV 同步完成"

      - name: 提交变更到 Git
        run: |
          echo "📝 提交变更..."
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add links.txt usb.txt
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "更新链接文件"
            git push
            echo "✅ 变更已提交"
          else
            echo "📋 没有需要提交的变更"
          fi

  cleanup-workflow-runs:
    runs-on: ubuntu-latest
    needs: upload-to-r2

    steps:
      - name: 安装 jq 工具
        run: sudo apt-get install -y jq

      - name: 清理已完成的工作流
        env:
          GH_TOKEN: ${{ secrets.GT_TOKEN }}
        run: |
          echo "🗑️ 清理已完成的工作流..."
          工作流ID列表=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" \
            | jq '.workflow_runs[] | select(.status == "completed") | .id')
          已清理数量=0
          for 工作流ID in $工作流ID列表; do
            echo "正在删除工作流 ID: $工作流ID"
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$工作流ID"
            ((已清理数量++))
          done
          echo "✅ 已清理 $已清理数量 个工作流记录"
