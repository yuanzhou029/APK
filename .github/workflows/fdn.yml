name: get_ips

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r fdn/requirements.txt

      - name: 运行脚本
        working-directory: fdn
        run: python get_ips.py

      - name: 提交 data.txt 回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fdn/data.txt
          if git diff --cached --quiet; then
            echo "data.txt 无变更，跳过提交"
          else
            git commit -m "自动更新 data.txt $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
