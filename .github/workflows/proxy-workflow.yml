name: Proxy IP检测和CF域名解析

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC时间0点运行
  workflow_dispatch:     # 手动触发

jobs:
  proxy-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: 记录开始时间
      id: start_time
      run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT

    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r Proxyip/requirements.txt

    - name: 清理历史数据
      run: |
        cd Proxyip
        echo "🧹 清理历史数据..."
        # 清理valid_proxies目录下的所有txt文件
        rm -f valid_proxies/*.txt 2>/dev/null || true
        # 清理source_ips目录
        rm -rf source_ips 2>/dev/null || true
        # 清理临时文件
        rm -f temp_ips.txt 2>/dev/null || true
        rm -rf temp_downloads temp_extract 2>/dev/null || true
        # 清理可能的缓存文件
        rm -f *.log 2>/dev/null || true
        rm -f __pycache__/*.pyc 2>/dev/null || true
        echo "✅ 历史数据清理完成"

    - name: 下载并解压IP源数据
      run: |
        cd Proxyip && python download_and_extract.py

    - name: 运行代理检测
      run: |
        cd Proxyip && python ip.py

    - name: 运行子域名生成（上传到Cloudflare）
      id: cf_upload
      run: |
        cd Proxyip && python reverse_dns.py
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        CF_REVERSE_DOMAIN: ${{ secrets.CF_REVERSE_DOMAIN }}

    - name: 获取统计信息
      id: stats
      run: |
        cd Proxyip
        python get_stats.py
        # 计算运行时长
        END_TIME=$(date +%s)
        START_TIME=${{ steps.start_time.outputs.start }}
        DURATION=$((END_TIME - START_TIME))
        MINUTES=$((DURATION / 60))
        SECONDS=$((DURATION % 60))
        echo "run_time=${MINUTES}分${SECONDS}秒" >> $GITHUB_OUTPUT
      continue-on-error: true

    - name: 发送Telegram通知
      if: always()
      uses: appleboy/telegram-action@v0.1.1
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          📊 Proxy检测任务完成！
          
          🕐 运行时长: ${{ steps.stats.outputs.run_time || 'N/A' }}
          
          🌍 CF解析结果:
          ✅ 成功: ${{ steps.cf_upload.outputs.cf_total_created || '0' }}个
          ❌ 失败: ${{ steps.cf_upload.outputs.cf_total_failed || '0' }}个
          
          📈 按国家分类:
          ${{ steps.cf_upload.outputs.cf_country_stats || '无数据' }}
          
          ✅ 任务执行成功！

  cleanup-workflow-runs:
    runs-on: ubuntu-latest
    needs: proxy-check
    if: always()

    steps:
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Delete completed workflow runs
        env:
          GH_TOKEN: ${{ secrets.GT_TOKEN }}
        run: |
          echo "Fetching completed workflow runs..."
          RUN_IDS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" \
            | jq '.workflow_runs[] | select(.status == "completed") | .id')
          for run_id in $RUN_IDS; do
            echo "Deleting run ID: $run_id"
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
