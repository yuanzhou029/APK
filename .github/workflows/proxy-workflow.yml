name: Proxy IP检测和CF域名解析

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC时间0点运行
  workflow_dispatch:     # 手动触发

jobs:
  proxy-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r Proxyip/requirements.txt

    - name: 运行代理检测
      run: |
        cd Proxyip && python ip.py

    - name: 配置主域名
      run: |
        cd Proxyip && echo '{"main_domain": "${{ secrets.MAIN_DOMAIN }}", "subdomain_generation": {"mode": "filename"}}' > example_config.json
      env:
        MAIN_DOMAIN: ${{ secrets.MAIN_DOMAIN }}
      if: env.MAIN_DOMAIN != ''
    - name: 运行子域名生成（上传到Cloudflare）
      run: |
        cd Proxyip && python reverse_dns.py
      env:
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

    - name: 获取统计信息
      id: stats
      run: |
        cd Proxyip
        python get_stats.py
      continue-on-error: true

    - name: 发送Telegram通知
      if: always()
      uses: appleboy/telegram-action@v0.1.1
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          📊 Proxy检测任务完成！
          
          🕐 运行时长: ${{ steps.stats.outputs.RUN_TIME || 'N/A' }}秒
          
          🌍 检测结果:
            总有效代理数: ${{ steps.stats.outputs.total_proxies || 'N/A' }}个
            国家数量: ${{ steps.stats.outputs.total_countries || 'N/A' }}个
          
          🌐 子域名生成:
            总子域名数: ${{ steps.stats.outputs.total_subdomains || 'N/A' }}个
            文件数: ${{ steps.stats.outputs.subdomain_files || 'N/A' }}个
          
          ✅ 任务执行成功！
